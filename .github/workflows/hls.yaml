# High-level synthesis of the GIFT-64-128 reference C code with Bambu (PandA).
# Runs only when started by hand (Actions tab > hls > Run workflow), so it never
# runs on a normal push and does not affect the Tiny Tapeout gds/test/docs runs.
#
# Bambu ships only x86_64 Linux builds, so it runs here on GitHub's Ubuntu runner.

name: hls

on:
  workflow_dispatch:

jobs:
  bambu:
    # Ubuntu 22.04: Bambu's bundled clang-16 needs libtinfo.so.5, which 24.04 no longer ships.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      BAMBU_VERSION: "2024.10"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Cache the Bambu AppImage (about 1.3 GB)
        id: cache
        uses: actions/cache@v4
        with:
          path: bambu.AppImage
          key: bambu-${{ env.BAMBU_VERSION }}

      - name: Download Bambu ${{ env.BAMBU_VERSION }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: curl -fL --retry 3 -o bambu.AppImage "https://release.bambuhls.eu/bambu-${BAMBU_VERSION}.AppImage"

      - name: Set up the bambu command and print its version
        # Run the AppImage the way Bambu's own CI does: through a link named
        # "bambu", because the launcher inside the AppImage picks the tool from
        # the name it was called with. APPIMAGE_EXTRACT_AND_RUN=1 lets it run
        # without FUSE, which this runner does not have.
        run: |
          sha256sum bambu.AppImage
          chmod +x bambu.AppImage
          mkdir -p bin
          ln -sf "$PWD/bambu.AppImage" bin/bambu
          echo "$PWD/bin" >> "$GITHUB_PATH"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          APPIMAGE_EXTRACT_AND_RUN=1 bin/bambu --version

      - name: Install Verilator, libtinfo5 and multilib headers (for Bambu's testbench build)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q verilator libtinfo5 gcc-multilib g++-multilib
          verilator --version

      - name: Write the testbench inputs (3 official + 5 random vectors)
        run: python3 hls/gen_tb_xml.py

      - name: Run Bambu (C to Verilog, then simulate the Verilog)
        run: |
          mkdir -p hls_out
          cd hls_out
          # The AppImage launcher changes into the folder named in OWD before
          # starting bambu; set it here so bambu runs (and writes) in hls_out.
          export OWD="$PWD"
          bambu "$GITHUB_WORKSPACE/hls/gift64_hls.c" \
            --top-fname=gift64_enc \
            --device-name=nangate45 \
            --clock-period=20 \
            -O2 \
            --generate-tb="$GITHUB_WORKSPACE/hls/test.xml" \
            --simulate --simulator=VERILATOR \
            -v3 2>&1 | tee bambu.log
          status=${PIPESTATUS[0]}
          ls -la
          exit $status

      - name: Summary (cycles and any errors)
        if: always()
        run: grep -i -E "cycles|error|mismatch|fail" hls_out/bambu.log | tail -40 || true

      - name: Upload Bambu outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hls_out
          path: |
            hls_out
            hls/test.xml
