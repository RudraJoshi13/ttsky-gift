# High-level synthesis of the GIFT-64-128 reference C code with Bambu (PandA).
# Runs only when started by hand (Actions tab > hls > Run workflow), so it never
# runs on a normal push and does not affect the Tiny Tapeout gds/test/docs runs.
#
# Bambu ships only x86_64 Linux builds, so it runs here on GitHub's Ubuntu runner.

name: hls

on:
  workflow_dispatch:

jobs:
  bambu:
    # Ubuntu 22.04: Bambu's bundled clang-16 needs libtinfo.so.5, which 24.04 no longer ships.
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      BAMBU_VERSION: "2024.10"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Cache the Bambu AppImage (about 1.3 GB)
        id: cache
        uses: actions/cache@v4
        with:
          path: bambu.AppImage
          key: bambu-${{ env.BAMBU_VERSION }}

      - name: Download Bambu ${{ env.BAMBU_VERSION }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: curl -fL --retry 3 -o bambu.AppImage "https://release.bambuhls.eu/bambu-${BAMBU_VERSION}.AppImage"

      - name: Set up the bambu command and print its version
        # Run the AppImage the way Bambu's own CI does: through a link named
        # "bambu", because the launcher inside the AppImage picks the tool from
        # the name it was called with. APPIMAGE_EXTRACT_AND_RUN=1 lets it run
        # without FUSE, which this runner does not have.
        run: |
          sha256sum bambu.AppImage
          chmod +x bambu.AppImage
          mkdir -p bin
          ln -sf "$PWD/bambu.AppImage" bin/bambu
          echo "$PWD/bin" >> "$GITHUB_PATH"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          APPIMAGE_EXTRACT_AND_RUN=1 bin/bambu --version

      - name: Install Verilator, libtinfo5 and multilib headers (for Bambu's testbench build)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q verilator libtinfo5 gcc-multilib g++-multilib
          verilator --version

      - name: Write the testbench inputs (3 official + 5 random vectors, for both tops)
        run: python3 hls/gen_tb_xml.py

      - name: Run Bambu on each configuration (C to Verilog, then simulate)
        # A: reference C as before (baseline).
        # B: same cipher code + unroll/inline pragmas + 64-bit top, -O3.
        # C: B + --rom-duplication (lets the S-box table be read 16 times per cycle).
        # D: C + the 28-round loop unrolled too (-DUNROLL_ROUNDS), fully combinational.
        # Each configuration runs in its own folder; a failure does not stop the others.
        run: |
          W="$GITHUB_WORKSPACE/hls"
          COMMON="--device-name=nangate45 --clock-period=20 --simulate --simulator=VERILATOR -v3"
          run_cfg() {
            name=$1; shift
            mkdir -p "hls_out/$name"
            ( cd "hls_out/$name"
              export OWD="$PWD"
              echo "bambu $*" > command.txt
              timeout 45m bambu "$@" > bambu.log 2>&1
              echo $? > exit_code.txt )
            echo "config $name: exit $(cat hls_out/$name/exit_code.txt)"
          }
          run_cfg A "$W/gift64_hls.c"     --top-fname=gift64_enc -O2 --generate-tb="$W/test.xml"     $COMMON
          run_cfg B "$W/gift64_hls_opt.c" --top-fname=gift64_top -O3 --generate-tb="$W/test_top.xml" $COMMON
          run_cfg C "$W/gift64_hls_opt.c" --top-fname=gift64_top -O3 --rom-duplication --generate-tb="$W/test_top.xml" $COMMON
          run_cfg D "$W/gift64_hls_opt.c" --top-fname=gift64_top -O3 --rom-duplication -DUNROLL_ROUNDS --generate-tb="$W/test_top.xml" $COMMON

      - name: Summary (per configuration)
        if: always()
        run: |
          for c in A B C D; do
            L="hls_out/$c/bambu.log"
            echo "=== $c: exit $(cat hls_out/$c/exit_code.txt 2>/dev/null)"
            grep -E "Average execution|Number of executions|Total number of flip-flops|Number of states|Estimated max frequency" "$L" | tail -6 || true
            grep -i -E "mismatch|error" "$L" | tail -5 || true
          done

      - name: Upload Bambu outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hls_out
          path: |
            hls_out
            hls/test.xml
            hls/test_top.xml
